server { listen 8400; root /usr/share/nginx/html; index index.html;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
  add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always;
  location / { try_files $uri /index.html; }
  location /v1/ { proxy_pass http://reranker-api:8200; proxy_set_header Host $host; }
  location /health/ { proxy_pass http://reranker-api:8200; }
}
