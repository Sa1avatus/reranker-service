[project]
name = "reranker-service"
version = "0.1.0"
description = "Production-oriented cross-encoder reranking service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "pydantic==2.11.7",
  "pydantic-settings==2.10.1", "sentence-transformers==5.0.0", "torch==2.7.1",
  "redis==6.2.0", "httpx==0.28.1", "structlog==25.4.0",
  "prometheus-client==0.22.1", "opentelemetry-api==1.35.0",
  "opentelemetry-sdk==1.35.0", "opentelemetry-instrumentation-fastapi==0.56b0",
  "psutil==7.0.0", "python-multipart==0.0.20"
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "pytest-cov==6.2.1", "mypy==1.17.0", "ruff==0.12.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=reranker_service --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
