services:
  reranker-api:
    build: {context: ., target: runtime-jina}
    environment:
      RERANKER_BACKEND: jina_listwise
      RERANKER_MODEL: jinaai/jina-reranker-v3
      RERANKER_MODEL_REVISION: d7d7e73b6ea138ced340b83865931b5dfb6c97aa
      RERANKER_MODEL_ALLOWLIST: jinaai/jina-reranker-v3
      RERANKER_DEVICE: auto
      RERANKER_PRECISION: fp16
      RERANKER_TRUST_REMOTE_CODE: "true"
      RERANKER_REMOTE_CODE_ALLOWLIST: jinaai/jina-reranker-v3
      RERANKER_DYNAMIC_BATCHING: "false"
      RERANKER_CACHE_ENABLED: "false"
      HF_HOME: /models/hf-cache
